# ====================================
# AVENLO CORE - RAILWAY CONFIGURATION
# Multi-Service Deployment Guide
# ====================================

# This project uses Railway's multi-service architecture.
# Each service should be created separately in Railway:
#
# 1. GATEWAY SERVICE (Main Bot)
#    - Root Directory: /
#    - Uses this railway.toml
#    - Dockerfile: services/gateway/Dockerfile
#
# 2. DASHBOARD SERVICE
#    - Root Directory: services/dashboard
#    - Uses services/dashboard/railway.toml
#
# 3. ARCHITECT SERVICE (AI Scoping)
#    - Root Directory: /
#    - Create custom railway.toml or use Docker build
#    - Dockerfile: services/architect/Dockerfile
#
# 4. LEDGER SERVICE (Economy)
#    - Root Directory: /
#    - Dockerfile: services/ledger/Dockerfile
#
# 5. PULSE SERVICE (DevOps)
#    - Root Directory: /
#    - Dockerfile: services/pulse/Dockerfile

# ====================================
# GATEWAY SERVICE (DEFAULT)
# ====================================

[build]
builder = "dockerfile"
dockerfilePath = "services/gateway/Dockerfile"

[deploy]
startCommand = "node services/gateway/dist/index.js"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
numReplicas = 1

# ====================================
# ENVIRONMENT VARIABLES (Set in Railway Dashboard)
# ====================================
# Required for Gateway:
#   DISCORD_TOKEN          - Bot token
#   DISCORD_CLIENT_ID      - Application client ID
#   DISCORD_GUILD_ID       - Target server ID
#   MONGODB_URI            - MongoDB connection string
#   REDIS_URL              - Redis connection string
#   ENCRYPTION_KEY         - 32-byte hex key for encryption
#   OPENAI_API_KEY         - For Guardian AI moderation
#
# Optional:
#   ANTHROPIC_API_KEY      - For multi-model AI
#   LOG_LEVEL              - debug | info | warn | error

