# ====================================
# AVENLO CORE - RAILWAY CONFIGURATION
# ====================================

# NOTE: This is the DEFAULT config for the Gateway service.
# Dashboard has its own config at services/dashboard/railway.toml
# When creating a dashboard service, set Root Directory to "services/dashboard"

[build]
builder = "dockerfile"
dockerfilePath = "services/gateway/Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
