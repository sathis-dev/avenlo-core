  #   container_name: avenlo-dashboard
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #   environment:
  #     NODE_ENV: production
  #     VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
  #   depends_on:
  #     redis:
  #       condition: service_healthy
  #     mongodb:
  #       condition: service_healthy
  #   networks:
  #     - avenlo-network

volumes:
  redis-data:
    driver: local
  mongodb-data:
    driver: local

networks:
  avenlo-network:
    driver: bridge
